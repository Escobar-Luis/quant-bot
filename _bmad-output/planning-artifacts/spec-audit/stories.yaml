- id: "1"
  title: Land collection and extraction code on main
  description: >-
    CAP-1. Bring app/lpp from branch story/extract-lpp onto main and script the LPP link and caption fetch, so every course has a documented command that lists its sources and event counts.
  invoke_dev_with: >-
    The extract-lpp worktree is .claude/worktrees/extract-lpp-aa4bcf (branch story/extract-lpp); merge, don't rewrite. Never commit raw captions or course text. Dependency changes (uv.lock) go in their own small commit. Also explain ZipTrader's 86 events vs 1 priced trade.
- id: "2"
  title: Second calculator that checks the money math
  description: >-
    CAP-3, the gate for the post and video render. An independent recompute of every copied trade and headline per course and delay, reconciled with results/, plus a 10-trade hand-check sheet with raw bars.
  done_checkpoint: true
  invoke_dev_with: >-
    New package app/audit/. Must not import app/backtest/engine.py. Write the full LPP trade ledger (all 315 at 5 min, not the 200-trade sample) to a gitignored file. Tolerance: 1 cent per trade, 1 dollar per headline. Prove it fails on an altered result. Written from contracts.md only; cached bars only, no network. Make the engine emit its full ledger (gitignored) to diff all trades. Record the pass in proofs/audit.json with the results git_sha. Covers every results file, delay and portfolio.
- id: "9"
  title: No look-ahead in copy decisions
  description: >-
    CAP-12. Overnight holds, sizes and adds are decided only from what was said before each moment.
  invoke_dev_with: >-
    Engine change (app/backtest/lpp.py keeps a position overnight when a later statement within CARRY_DAYS=7 mentions it; scaled entry size counts later adds). Amend AGENTS.md contracts 1 and 6 first. Rerun results and app/audit; report every headline that moves.
- id: "18"
  title: Re-audit LPP exits from his Discord chat
  description: >-
    CAP-13. Read LPP's Discord channels where he posts closes, match each post to a stream trade, and rebuild every exit from what he actually said or posted; count trades whose exit is still assumed.
  spec_checkpoint: true
  invoke_dev_with: >-
    Read-only and supervised via Luis's Chrome (memory: discord-chrome-collection); no bulk scraping, no posting. Raw messages stay in data/lpp/discord/. First measure: of the 43 overnight trades, how many have a same-day close in chat.
- id: "19"
  title: Write down his strategy
  description: >-
    CAP-14. From the accurate record, state LPP's strategy as rules with frequency, win rate and P&L per rule, citing short quotes.
  invoke_dev_with: >-
    Model proposes rule wording through Nicrron, traced to PRISM; code computes every number. Depends on 18 and 17.
- id: "20"
  title: Improve it from his losses
  description: >-
    CAP-15. Propose rule changes from his losing trades, as code; pick on dev months, confirm on held-out months.
  invoke_dev_with: >-
    Extend the existing improver (daytrader-improver-v1); log every version tried (AGENTS.md rule 4).
- id: "21"
  title: Backtest the strategy on new prices and other stocks
  description: >-
    CAP-15. Run his strategy and the improved one as code on recent prices and on stocks he didn't trade; show what works and what doesn't.
  invoke_dev_with: >-
    Alpaca 1-minute bars; pick the stock universe before looking at results; report all variants tried.
- id: "28"
  title: Honest strategy evaluation
  description: >-
    CAP-16. Trial counts with a deflated-Sharpe haircut, shuffle test, walk-forward folds, threshold sensitivity, bull vs bear split, and risk metrics for every strategy claim (stories 20 and 21).
  invoke_dev_with: >-
    Read notes/research/quant-practice-2026-10-20.md. Absorbs story 27 (luck test). Audit recomputes the new numbers independently.
- id: "29"
  title: Realistic costs for small caps and shorts
  description: >-
    CAP-17. Spread/slippage by price and volume, 2x cost stress, borrow fees and hard-to-borrow flags, gap fills at the open.
  invoke_dev_with: >-
    Contract first; regenerate all results; show base and stressed side by side.
- id: "30"
  title: Forward paper test from a frozen rule file
  description: >-
    CAP-18. Freeze the best-supported rules at a tagged commit and paper-trade them forward daily on live prices.
  invoke_dev_with: >-
    Fake money only (AGENTS.md rule 7); Alpaca paper or computed from bars; never a real brokerage.
- id: "8"
  title: Bankroll simulator
  description: >-
    CAP-9. Publish the full per-trade ledger in results/ and let the user pick amount, start and stop dates; one account copies every trade with no deposits, compounding gains and losses, vs the same money in the benchmark.
  spec_checkpoint: true
  invoke_dev_with: >-
    First amend AGENTS.md contracts 1 and 6 and add the ledger shape to contracts.md, by PR. Rules: bankroll-rules.md. Extend story 2's calculator with the bankroll rule. The browser computes from the ledger; story 2's calculator gets the same bankroll rule and must reproduce it. No margin. Do not redeploy.
- id: "3"
  title: Results by year and all time
  description: >-
    CAP-4. Add per-calendar-year and all-time numbers per course and delay to results/ and show them in the app, matching the story 2 recompute.
  invoke_dev_with: >-
    First add the key's shape to contracts.md by PR. Year rules are in SPEC.md Assumptions. Depends on story 2. Do not redeploy.
- id: "4"
  title: Honest verdict words
  description: >-
    CAP-7. A verdict never reads as success when the copy lost money, and v2 is compared only with v1 on the same sessions.
  invoke_dev_with: >-
    First change AGENTS.md decision 1 and contracts.md by PR, then message lanes. Crypto Wizard: say it lost money and lost less than Bitcoin, at every delay. Do not redeploy.
- id: "10"
  title: Fair comparisons on every card
  description: >-
    CAP-11. Benchmark at the same money invested, the held-out months' own verdict, S&P with dividends, and the result with and without assumed trades.
  invoke_dev_with: >-
    Additive results keys, contract first. Depends on story 9. Do not redeploy.
- id: "11"
  title: What worked, what didn't, and why
  description: >-
    CAP-10. Per course, the best and worst kinds of trades with numbers, and a likely reason from measured market conditions in those months.
  spec_checkpoint: true
  invoke_dev_with: >-
    The model may word the reason; the numbers and the market measures come from code. Label it "likely reason". Route the model call through Nicrron, traced to PRISM as daytrader-insights-v1; cache market measures with a named source.
- id: "5"
  title: Luis grades a sample of extracted events
  description: >-
    CAP-2. A small local grading page shows each sampled event beside its source quote and context; Luis's verdicts give human precision and recall per course.
  spec_checkpoint: true
  invoke_dev_with: >-
    Sample 30 LPP, 30 Crypto Wizard, all 86 ZipTrader events, seeded and reproducible. Local only: raw text never leaves data/. Store sampled event ids plus the events.jsonl hash. Recall: Luis lists missed trades in 3 sampled LPP sessions.
- id: "6"
  title: Evals view and an auditable README
  description: >-
    CAP-5 and CAP-6. One evals view lists every check and evaluator with its score and source; the README gets the architecture diagram, tech stack, data layout and counts, assumptions and caveats, and fixes the three wrong claims.
  invoke_dev_with: >-
    Use architecture-diagrams.md in the spec folder as the starting diagram. Numbers come from results/, proofs/ and the story 2 and 5 outputs only. Also cover: 1y range vs full window, SPY price-only caveat, PRISM numbers-grounded denominator (52/66 vs 53.3/66.7). Depends on stories 2 and 5.
- id: "7"
  title: Video beat on how we know, then render
  description: >-
    CAP-8. Add a beat to the Oct 21 episode naming the second calculator's result, then render the video and the 4:5 cut.
  invoke_dev_with: >-
    Repo ~/dev/showcase-videos/day-trader-ai-2026-10-21. Render only after story 2's gate opens (exit 0 plus Luis's sign-off). Runs in its own session in that repo. Never post.
- id: "12"
  title: AGENTS.md stops overclaiming tracing and the sealed holdout
  description: >-
    CAP-6 follow-up. AGENTS.md shared rule 1 says "every run is traced to PRISM" (only the 30-session LPP proof set and verdict runs are, per contract 5), and rule 4 promises a sealed holdout after the model's training cutoff (LPP's held-out months from 2025-06-12 predate it). Reword both to match what is true.
  invoke_dev_with: >-
    AGENTS.md change by PR, then message the running lanes. Wording only; the README (story audit-6-readme) already states the true scope.
- id: "13"
  title: ZipTrader results say 13 briefings, there are 12
  description: >-
    results/ziptrader/v1.json unknown says "Only 13 briefings"; build() in app/backtest/ziptrader.py counts distinct source_ids, which includes the strategy card. Count briefings only.
  invoke_dev_with: >-
    Found in notes/sources/counts.md. Writes results/: amend AGENTS.md contracts 1 and 6 first if required, rerun app/audit and refresh proofs/audit.json. Do not redeploy.
- id: "14"
  title: Refresh proofs/prism.json from current results
  description: >-
    proofs/prism.json predates the audit engine fixes (PR #58): knowledge_base.answer quotes $9,765.86 and its hit snippets say 3000 passed / 1196 in review (now $9,763.83, 2,883 / 1,313); evaluator.money_same_sessions says $10,290.71 / $10,303.25 vs results/lpp/v2.json $10,287.41 / $10,300.52. Refresh the numbers from results/.
  invoke_dev_with: >-
    Owner: app/prism (story 2 lane). No new PRISM runs needed for the numbers; rebuild via prism.proofs from current results. The KB answer text is model output: either rerun the verdict run or mark it as the text of that dated run. Then update the README note in "Architecture".
- id: "15"
  title: Ledgers per worktree, so parallel reruns don't clobber each other
  description: >-
    CAP-3 hygiene. backtest.run writes data/audit/<course>-<version>-ledger.jsonl into the one shared data/ folder (every worktree reads it via DATA_DIR or the main checkout), so two branches regenerating results at once overwrite each other's ledgers and audit.run then fails as stale on whichever branch ran first.
  invoke_dev_with: >-
    Found by story 4 (audit-4-honest-words) while stories 9 and 3 regenerate results on other branches. Key the ledger file by results sha256 (or branch) and let audit.run pick the ledger whose stamp matches the results file; keep inputs (events, bars) shared. Contract 6 lists data/audit/; amend it first if the path changes.
- id: "16"
  title: Time-range chips slice the one all-time run
  description: >-
    CAP-4 follow-up. extras.ranges (3m/6m/1y) re-runs the cash cap on the trades closed by each cutoff instead of slicing the all-time run, so a range can count trades the headline sized down or skipped differently, and it can disagree with by_year and the money curve on the same date.
  invoke_dev_with: >-
    Use the headline's fit_to_cash once, then cut by exit day (as extras.by_year does); add the ranges to app/audit's reconciliation. Writes results/: contract first, rerun app/audit. Do not redeploy.
- id: "17"
  title: Extract hold intent
  description: >-
    CAP-12 follow-up. A model pass over the LPP captions records what he says about holding (a stated horizon, holding overnight or over a weekend, or saying he won't hold) with its timestamp, into each trade event's `horizon` field, so contracts.md rule 13 can keep a position overnight only on intent said before 15:55 ET.
  invoke_dev_with: >-
    Found in the PR #61 review: of the 43 as-taught swing trades, 2 have clear hold intent, 4 are ambiguous and 1 is an explicit no-hold; streams end about 10:30 ET, so most intent, if said, is said early. The model proposes, the code decides: keep the quote (12 words or fewer) and t_s as evidence, trace to PRISM, and never let a statement after 15:55 ET of the session count. Then rerun results (no_look_ahead key) and app/audit. Rule 13 becomes the headline only after this and story 8 (bankroll model). Raw captions stay in data/.
- id: "22"
  title: Hold intent for LPP v2, and act on the stated no-holds
  description: >-
    Story 17 follow-up. The hold-intent pass (app/lpp/hold_intent.py) wrote `horizon` on LPP v1 events only, so results/lpp/v2.json's no_look_ahead still has no hold intent. It also found 3 of the 43 as-taught overnight trades where he said in the stream he would not carry the position overnight (TSLA 2024-10-24, HOOD 2025-07-07, HIMS 2025-05-07), which rule 11's as-taught headline still holds for 5 sessions.
  invoke_dev_with: >-
    Map v2 trade events to the v1 decisions (data/lpp/hold_intent/decisions.jsonl) by session, ticker, side and t_s, or run the pass on v2 positions (about $4 at Nicrron's Sonnet price); trace under extract-lpp-hold-v1 with prompt_version lpp-hold-v1. Raise the 3 stated no-holds with story 18 (Discord exits) before any change to rule 11. Rerun results under the data lock, app/audit must pass.
- id: "23"
  title: Find the channel where he posted closes
  description: >-
    CAP-13 follow-up. On 2024-10-14 the host says he closed a trade and posted it in a channel that renders as "unknown" to Luis's account, likely one Luis can no longer see. Its close posts were never read, so some LPP exits there may be missing.
  invoke_dev_with: >-
    Found by story 18 (notes/sources/lpp-discord-exits.md, gap 1). Luis checks his roles and the server's channel list in his own Chrome, or asks the host's team for read access; never request access on his behalf. Once readable: targeted, read-only searches of the host's close posts for the 14 assumed overnight exits and the 2024-10-14 trade; raw posts to data/lpp/discord/; counts and quotes of 12 words or fewer only in git.
- id: "24"
  title: Measure his trades off the stream
  description: >-
    CAP-13 follow-up. The host trades and closes after the stream ends (about 10:30 ET), in the afternoon and sometimes premarket or after hours; those trades never appear in the captions, so the app never copies them. Measure how often: chat mentions of trades that are not on that day's stream.
  invoke_dev_with: >-
    Found by story 18 (notes/sources/lpp-discord-exits.md, gap 2). Read-only and supervised via Luis's Chrome (memory: discord-chrome-collection); targeted searches of the host's #main-chat posts on a seeded sample of sessions, not a bulk read of his 3,088 posts. Match each chat-mentioned open or close to that day's stream events by ticker and side; report counts (on stream, off stream, unclear) and what share of his trading the app misses. Raw posts stay in data/lpp/discord/. Decide with Luis before any engine change.
- id: "25"
  title: Check that each strategy rule's quote says the same thing
  description: >-
    CAP-14 follow-up. In strategy_profile (results/lpp/v1.json) the model picks one of his rule quotes per rule, and nothing checks that the quote supports the rule: S1 ("he mostly shorts") carries "it's just an overbought oversold reversal setup". A quote shown under a rule should say the same thing, or the rule shows none.
  invoke_dev_with: >-
    Found by story 19 (notes/sources/lpp-strategy.md, section 2). Either Luis grades the 8 rule-quote pairs on the local grading page (story 5's), or a second, cheap model check per pair traced under daytrader-strategy-v1 with its own prompt_version; code drops a quote that fails. Rerun backtest.run under the data lock; audit.run must pass. Do not redeploy.

- id: "26"
  title: Compare his self-reported day totals with our copy
  description: >-
    CAP-13 follow-up. In #main-chat the host sometimes says where his day stands (e.g. "currently at 13k for the day"). Comparing those self-reported day totals with the copy's P&L for the same sessions shows how far the copy (5 min late, $1,000 per first buy, assumed 15:55 exits) is from what he says he made, and whether off-stream trades (story 24) explain the gap.
  invoke_dev_with: >-
    Found by story 20. Read-only and supervised via Luis's Chrome (memory: discord-chrome-collection); targeted searches of the host's own posts for day-total phrases, not a bulk read. Per day: his stated total (quote of 12 words or fewer, with time), our copied P&L that day scaled to his stated size where he gave one, and the trades on that day's stream. Raw posts stay in data/lpp/discord/; report counts and the gap distribution only. Decide with Luis before any engine change.
- id: "27"
  title: How much of the improvement is luck
  description: >-
    CAP-15 follow-up. Story 20 priced 10 distinct rule changes (6 from the model, 4 by the engineer) and kept 4 whose held-out gains are 0.2 to 2 points on about 100 trades. Nothing yet says whether gains that small survive having tried 10 variants.
  invoke_dev_with: >-
    Found by story 20 (notes/research/backtesting.md, section 6). Bootstrap the sealed trades (resample days) for each kept change vs as-is, and a deflated-Sharpe or White's-reality-check style correction with N = every variant in the log; report it in the improvements key only after a contract change in contracts.md. Reuse the 6 cached proposals (no new model call). Rerun under the data lock; audit.run must pass. Do not redeploy.
- id: "31"
  title: Compare S4 with the S&P at the same money at risk
  description: >-
    CAP-15 follow-up. Story 21 found S4 ("short a hot stock that opened 5%+ up") beats 2,000 random draws on his stocks and on 20 new ones, but at $1,000 a trade it earns +6% / +11% against SPY's +17.7%, a fully invested benchmark. Nothing yet compares it at equal exposure or sizes it to use the account.
  invoke_dev_with: >-
    Found by story 21 (notes/research/strategy-as-code.md, section 9). Pre-register first (new spec section, committed before the run): an exposure-matched SPY (same dollars for the same hours) and one sizing rule (e.g. a fixed share of the account per trade, capped by cash, no margin); reuse the cached bars in data/bars (no new fetch unless the spec says so). Feed the frozen rule into story 30 (forward paper test) rather than re-tuning on the spent window. Contract first; audit.lab recomputes. Do not redeploy.
- id: "32"
  title: Point-in-time borrow and universe for the strategy lab
  description: >-
    CAP-17 follow-up. Story 21 flags hard-to-borrow shorts with Alpaca's easy_to_borrow flag as of today, not the trade date, and picks the "other stocks" from today's asset list, so names delisted since 2025-09-12 are missing (survivorship). 45% of the short-every-open control's trades on the other hot list are hard-to-borrow today.
  invoke_dev_with: >-
    Found by story 21. Find a point-in-time source for borrow availability and fees (or bound it: drop hard-to-borrow names as a variant), and rebuild the universe picker from a dated listing that includes delisted names; log both as new variants in notes/research/strategy-as-code.md. Fold into story 29's cost model if it lands first.
- id: "33"
  title: Schedule the daily paper test run
  description: >-
    CAP-18 follow-up. Story 30 froze S4 and S5 (tag paper-rules-v1) and built `paper.run`, which adds each completed session to results/paper/; today it runs only when someone types it. Run it every trading day after 16:30 ET, then `audit.run`, and commit results/paper/ and proofs/audit.json on a branch with a PR.
  invoke_dev_with: >-
    Needs Luis's OK first: a standing scheduled job (launchd, cron or a scheduled agent) is persistent configuration. Fake money only; use the data lock; a missed day is caught up by the next run. Decide with Luis whether each day's update merges by itself or waits for him, and whether the public app is redeployed (not without his OK).
